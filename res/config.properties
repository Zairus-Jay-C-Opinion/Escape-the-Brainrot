# All balance numbers live here. Do not hard-code them in Java.

# Brainrot Gauge (Gauge = Rot + Strain)
gauge.max=100
rot.start=40
strain.start=50
rot.concept.boss=6
rot.final.boss=10
# Extra strain rate gained for each point of rot cleared
strain.rate.bonus.per.rot=0.25

# Strain: how often it rises (seconds) and by how much, per difficulty
strain.easy.interval=20
strain.easy.penalty=3
strain.medium.interval=15
strain.medium.penalty=5
strain.hard.interval=10
strain.hard.penalty=8

# Player walking speed in pixels per update (one tile is 48 pixels, so 4 = 12 updates per tile)
player.speed=4
