# All balance numbers live here. Do not hard-code them in Java.

# Brainrot Gauge: Rot and Strain are separate meters. Only Strain can fry the player.
# Strain is capped at gauge.max, and the brain fries when Strain reaches strain.fried.threshold.
gauge.max=100
strain.fried.threshold=100
rot.start=100
strain.start=50
rot.concept.boss=16
rot.final.boss=20
# Extra strain rate gained for each point of rot cleared
strain.rate.bonus.per.rot=0.25

# Strain: how often it rises (seconds) and by how much, per difficulty
strain.easy.interval=20
strain.easy.penalty=3
strain.medium.interval=15
strain.medium.penalty=5
strain.hard.interval=10
strain.hard.penalty=8

# Player walking speed in pixels per update (one tile is 48 pixels, so 2 = 24 updates per tile)
player.speed=2

# Battle: a wrong answer costs the question's difficulty penalty (above) times the phase multiplier
battle.damagePerCorrect=1
battle.correctStrainReward=10
phase2.wrongMultiplier=1.5
phase3.wrongMultiplier=2.0
# Phase 2 & 3 modifiers: strain ticks arrive after this fraction of the normal interval
modifier.overclock.intervalMultiplier=0.6
modifier.overdrive.intervalMultiplier=0.45

# Checkpoints, Save/Load & Rebirths
save.file.path=savegame.properties
rebirth.max=3
